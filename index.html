<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#175cd3">
    <meta name="description" content="부산 공영주차장 실시간 주차현황과 위치 정보를 확인하세요.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="부산 주차장">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>부산 공영주차장 현황</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="page-header">
            <div class="brand-mark" aria-hidden="true">P</div>
            <div class="eyebrow">BUSAN PARKING</div>
            <h1>부산 공영주차장 현황</h1>
            <p class="description">부산시설공단 실시간 주차현황과 부산광역시 기본정보를 한곳에서 확인하세요.</p>
            <div class="pwa-install-row">
                <button id="installBtn" class="install-app-btn" type="button" aria-describedby="pwaInstallStatus">
                    <span aria-hidden="true">⇩</span> 앱 설치
                </button>
                <span id="pwaInstallStatus" class="pwa-install-status" role="status" aria-live="polite">홈 화면에 추가해 앱처럼 빠르게 이용하세요.</span>
            </div>
        </header>

        <section class="toolbar" aria-label="주차장 검색 및 필터">
            <form class="search-box" id="searchForm">
                <label class="sr-only" for="searchInput">주차장 이름 또는 주소 검색</label>
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="주차장 이름 또는 주소를 검색하세요"
                    autocomplete="off"
                    spellcheck="false">
                <button id="searchBtn" class="primary-btn" type="submit">검색</button>
                <button id="resetBtn" class="ghost-btn" type="button">전체보기</button>
            </form>

            <div class="control-row">
                <div class="control-group">
                    <label for="sortSelect">정렬</label>
                    <select id="sortSelect">
                        <option value="default">기본순</option>
                        <option value="available-desc">빈자리 많은 순</option>
                        <option value="available-asc">빈자리 적은 순</option>
                        <option value="name-asc">이름순</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="statusFilter">상태</label>
                    <select id="statusFilter">
                        <option value="all">전체</option>
                        <option value="available">빈자리 있음</option>
                        <option value="full">만차</option>
                        <option value="unknown">정보 없음</option>
                    </select>
                </div>

                <button id="refreshBtn" class="refresh-btn" type="button">
                    <span aria-hidden="true">↻</span>
                    <span class="refresh-label">최신 정보 갱신</span>
                </button>
            </div>
        </section>

        <section class="result-header" aria-live="polite">
            <div>
                <div id="summary" class="summary-text">주차장 정보를 준비하고 있습니다.</div>
                <div id="filterSummary" class="filter-summary"></div>
            </div>
            <div id="lastRefresh" class="last-refresh">데이터를 불러오는 중...</div>
        </section>

        <div class="status-hint">
            <span class="hint-dot" aria-hidden="true"></span>
            <span>빈자리 기준으로 정렬하면 여유 있는 주차장을 빠르게 찾을 수 있습니다.</span>
        </div>

        <main id="parkingList" class="parking-list" aria-live="polite"></main>

        <div id="paging" class="paging" aria-label="주차장 목록 페이지 이동">
            <button id="prevBtn" type="button" aria-label="이전 페이지">‹ 이전</button>
            <span id="pageInfo">1 / 1</span>
            <button id="nextBtn" type="button" aria-label="다음 페이지">다음 ›</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
    (() => {
        const installBtn = document.getElementById("installBtn");
        const installStatus = document.getElementById("pwaInstallStatus");
        let deferredInstallPrompt = null;

        const isStandalone = () =>
            window.matchMedia("(display-mode: standalone)").matches ||
            window.navigator.standalone === true;

        if (isStandalone()) {
            installBtn.disabled = true;
            installBtn.innerHTML = "✓ 설치된 앱";
            installStatus.textContent = "이미 앱 모드로 실행 중입니다.";
        }

        window.addEventListener("beforeinstallprompt", (event) => {
            event.preventDefault();
            deferredInstallPrompt = event;
            installBtn.disabled = false;
        });

        installBtn.addEventListener("click", async () => {
            if (isStandalone()) {
                installStatus.textContent = "이미 설치된 앱으로 실행 중입니다.";
                return;
            }

            if (!deferredInstallPrompt) {
                const isAppleMobile = /iphone|ipad|ipod/i.test(navigator.userAgent);
                installStatus.textContent = isAppleMobile
                    ? "Safari의 공유 버튼을 누른 뒤 ‘홈 화면에 추가’를 선택하세요."
                    : "브라우저 메뉴에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 선택하세요. 설치 메뉴가 나타나지 않으면 PWA 아이콘 파일이 추가된 뒤 다시 확인해 주세요.";
                return;
            }

            installBtn.disabled = true;
            try {
                deferredInstallPrompt.prompt();
                const result = await deferredInstallPrompt.userChoice;
                installStatus.textContent = result.outcome === "accepted"
                    ? "설치가 시작되었습니다. 완료되면 홈 화면에서 실행할 수 있습니다."
                    : "설치가 취소되었습니다. 나중에 다시 설치할 수 있습니다.";
            } catch (error) {
                console.error("PWA install prompt error:", error);
                installStatus.textContent = "자동 설치 창을 열지 못했습니다. 브라우저 메뉴의 설치 기능을 이용해 주세요.";
            } finally {
                deferredInstallPrompt = null;
                installBtn.disabled = false;
            }
        });

        window.addEventListener("appinstalled", () => {
            installBtn.disabled = true;
            installBtn.innerHTML = "✓ 설치된 앱";
            installStatus.textContent = "설치가 완료되었습니다. 홈 화면에서 부산 주차장을 실행할 수 있습니다.";
            deferredInstallPrompt = null;
        });

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js")
                    .then((registration) => {
                        console.info("PWA service worker registered:", registration.scope);
                    })
                    .catch((error) => {
                        console.error("PWA service worker registration failed:", error);
                        installStatus.textContent = "오프라인 캐시를 준비하지 못했습니다. 페이지는 계속 사용할 수 있습니다.";
                    });
            });
        } else {
            installStatus.textContent = "이 브라우저는 서비스 워커를 지원하지 않습니다. 최신 Chrome, Edge 또는 Safari를 이용해 주세요.";
        }
    })();
    </script>
</body>

</html>
